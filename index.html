<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Studio Pro Max | Versión Final</title>
    <!-- Librerías Externas -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Fira+Code&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #fff; margin: 0; overflow: hidden; }
        
        /* Capa de exportación invisible para renderizar a 1080x1350 */
        .export-layer {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1080px;
            height: 1350px;
        }

        /* Efecto de ruido/textura profesional */
        .noise-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.15;
            pointer-events: none;
            z-index: 5;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type=range] { accent-color: #3b82f6; cursor: pointer; }
        
        .slide-preview-container {
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.6), 0 18px 36px -18px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const FONTS = {
            Moderno: "'Inter', sans-serif",
            Elegante: "'Playfair Display', serif",
            Tecnico: "'Fira Code', monospace",
            Impacto: "'Montserrat', sans-serif"
        };

        const App = () => {
            const [slides, setSlides] = useState([
                { 
                    id: 1, 
                    title: "DISEÑO SISTÉMICO", 
                    text: "Escribe contenido complejo con una estética minimalista.\n\nUsa saltos de línea para separar párrafos de divulgación.", 
                    accent: '#3b82f6',
                    titleSize: 48,
                    textSize: 22,
                    contentAlign: 'left',
                    slideImage: null,
                    imageHeight: 40
                }
            ]);

            const [config, setConfig] = useState({
                font: 'Moderno',
                logo: 'TU_MARCA.DEV',
                logoSize: 24,
                logoPosition: 'top-left',
                bgType: 'gradient',
                globalImage: null,
                brandIcon: null,
                brandIconSize: 42
            });

            const [isExporting, setIsExporting] = useState(false);

            const updateSlide = (idx, field, value) => {
                const newSlides = [...slides];
                newSlides[idx] = { ...newSlides[idx], [field]: value };
                setSlides(newSlides);
            };

            const addSlide = () => {
                setSlides([...slides, { 
                    id: Date.now(), 
                    title: "Nuevo Punto", 
                    text: "Contenido de la diapositiva...", 
                    accent: '#3b82f6',
                    titleSize: 48,
                    textSize: 22,
                    contentAlign: 'left',
                    slideImage: null,
                    imageHeight: 40
                }]);
            };

            const handleImageUpload = (e, type, slideIdx = null) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (f) => {
                    if (type === 'global') setConfig({...config, globalImage: f.target.result, bgType: 'image'});
                    if (type === 'icon') setConfig({...config, brandIcon: f.target.result});
                    if (type === 'slide') updateSlide(slideIdx, 'slideImage', f.target.result);
                };
                reader.readAsDataURL(file);
            };

            const downloadAll = async () => {
                setIsExporting(true);
                const nodes = document.querySelectorAll('.slide-export-unit');
                for (let i = 0; i < nodes.length; i++) {
                    const canvas = await html2canvas(nodes[i], { 
                        scale: 2, 
                        useCORS: true, 
                        backgroundColor: '#000'
                    });
                    const link = document.createElement('a');
                    link.download = `carrusel_slide_${i + 1}.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    link.click();
                }
                setIsExporting(false);
            };

            return (
                <div className="flex h-screen w-full bg-[#050505]">
                    {/* PANEL DE CONTROL */}
                    <div className="w-[400px] border-r border-zinc-800 bg-[#0a0a0a] flex flex-col z-50">
                        <div className="p-6 border-b border-zinc-800">
                            <h1 className="text-xl font-black text-blue-500 tracking-tighter">CAROUSEL STUDIO PRO</h1>
                        </div>

                        <div className="flex-grow overflow-y-auto p-6 space-y-8 no-scrollbar">
                            {/* CONFIGURACIÓN GLOBAL */}
                            <section className="space-y-4">
                                <h2 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Identidad Global</h2>
                                <div className="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800 space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-[9px] text-zinc-500 font-bold uppercase">Logo / Icono</label>
                                        <input type="file" onChange={(e) => handleImageUpload(e, 'icon')} className="text-[10px] w-full file:bg-zinc-800 file:text-white file:px-2 file:py-1 file:rounded-full file:border-none" />
                                        {config.brandIcon && (
                                            <input type="range" min="20" max="250" value={config.brandIconSize} onChange={(e) => setConfig({...config, brandIconSize: parseInt(e.target.value)})} className="w-full" />
                                        )}
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[9px] text-zinc-500 font-bold uppercase">Nombre de Marca</label>
                                        <input type="text" value={config.logo} onChange={(e) => setConfig({...config, logo: e.target.value})} className="w-full bg-black border-zinc-800 border rounded-lg p-2 text-xs outline-none" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-1">
                                            <label className="text-[9px] text-zinc-500 font-bold uppercase">Tamaño</label>
                                            <input type="range" min="12" max="60" value={config.logoSize} onChange={(e) => setConfig({...config, logoSize: parseInt(e.target.value)})} className="w-full" />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[9px] text-zinc-500 font-bold uppercase">Posición</label>
                                            <select value={config.logoPosition} onChange={(e) => setConfig({...config, logoPosition: e.target.value})} className="w-full bg-black border-zinc-800 border rounded-lg p-1 text-[10px] outline-none">
                                                <option value="top-left">Sup. Izq</option>
                                                <option value="top-right">Sup. Der</option>
                                                <option value="bottom-left">Inf. Izq</option>
                                                <option value="bottom-right">Inf. Der</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-2 border-t border-zinc-800">
                                        <label className="text-[9px] text-zinc-500 font-bold uppercase">Fondo Global</label>
                                        <select value={config.bgType} onChange={(e) => setConfig({...config, bgType: e.target.value})} className="w-full bg-black border-zinc-800 border rounded-lg text-xs p-2 mb-2 outline-none">
                                            <option value="gradient">Gradiente Dinámico</option>
                                            <option value="image">Imagen de Fondo</option>
                                        </select>
                                        {config.bgType === 'image' && <input type="file" onChange={(e) => handleImageUpload(e, 'global')} className="text-[9px] w-full" />}
                                    </div>
                                </div>
                            </section>

                            {/* EDITOR DE SLIDES */}
                            <section className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Diapositivas</h2>
                                    <button onClick={addSlide} className="text-[9px] bg-blue-600 px-3 py-1 rounded-full font-bold uppercase">Añadir +</button>
                                </div>

                                {slides.map((slide, idx) => (
                                    <div key={slide.id} className="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl space-y-4">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] font-bold text-blue-400 uppercase">Slide {idx + 1}</span>
                                            <button onClick={() => setSlides(slides.filter(s => s.id !== slide.id))} className="text-zinc-600 hover:text-red-500">×</button>
                                        </div>

                                        <input type="text" value={slide.title} onChange={(e) => updateSlide(idx, 'title', e.target.value)} className="w-full bg-black border-zinc-800 border rounded-lg p-2 text-xs font-bold" placeholder="Título (Opcional)" />
                                        <input type="range" min="20" max="120" value={slide.titleSize} onChange={(e) => updateSlide(idx, 'titleSize', parseInt(e.target.value))} className="w-full h-1" title="Tamaño Título" />

                                        <textarea value={slide.text} onChange={(e) => updateSlide(idx, 'text', e.target.value)} className="w-full bg-black border-zinc-800 border rounded-lg p-2 text-xs h-24 resize-none" placeholder="Cuerpo del texto..." />
                                        <input type="range" min="12" max="60" value={slide.textSize} onChange={(e) => updateSlide(idx, 'textSize', parseInt(e.target.value))} className="w-full h-1" title="Tamaño Texto" />

                                        <div className="p-3 bg-black/40 rounded-xl border border-zinc-800 space-y-2">
                                            <label className="text-[8px] text-zinc-500 font-bold uppercase">Imagen de Slide</label>
                                            <input type="file" onChange={(e) => handleImageUpload(e, 'slide', idx)} className="text-[8px] w-full" />
                                            {slide.slideImage && (
                                                <input type="range" min="10" max="85" value={slide.imageHeight} onChange={(e) => updateSlide(idx, 'imageHeight', parseInt(e.target.value))} className="w-full" />
                                            )}
                                        </div>

                                        <div className="flex gap-2">
                                            <div className="flex flex-grow bg-black rounded-lg p-1 border border-zinc-800">
                                                {['left', 'center', 'right'].map(align => (
                                                    <button key={align} onClick={() => updateSlide(idx, 'contentAlign', align)} className={`flex-1 text-[8px] rounded py-1 ${slide.contentAlign === align ? 'bg-zinc-100 text-black' : 'text-zinc-600'}`}>
                                                        {align.toUpperCase()}
                                                    </button>
                                                ))}
                                            </div>
                                            <input type="color" value={slide.accent} onChange={(e) => updateSlide(idx, 'accent', e.target.value)} className="w-10 h-8 bg-transparent rounded cursor-pointer" />
                                        </div>
                                    </div>
                                ))}
                            </section>
                        </div>

                        <div className="p-6 border-t border-zinc-800 bg-black">
                            <button onClick={downloadAll} disabled={isExporting} className="w-full py-4 bg-blue-600 rounded-xl font-black text-xs tracking-widest hover:bg-blue-500 transition-all uppercase">
                                {isExporting ? 'Procesando...' : 'Exportar Carrusel PNG'}
                            </button>
                        </div>
                    </div>

                    {/* VISTA PREVIA (CANVAS) */}
                    <div className="flex-grow bg-[#020202] flex items-center justify-start overflow-x-auto p-12 no-scrollbar">
                        <div className="flex gap-12 px-12">
                            {slides.map((slide, i) => (
                                <div key={slide.id} className="slide-preview-container flex-shrink-0 transition-transform duration-500 hover:scale-[1.02]">
                                    <SlideContent slide={slide} config={config} index={i} total={slides.length} isPreview={true} />
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* CAPA DE EXPORTACIÓN (INVISIBLE) */}
                    <div className="export-layer">
                        {slides.map((slide, i) => (
                            <div key={`export-${slide.id}`} className="slide-export-unit">
                                <SlideContent slide={slide} config={config} index={i} total={slides.length} isPreview={false} />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SlideContent = ({ slide, config, index, total, isPreview }) => {
            const logoStyles = {
                'top-left': 'top-[6%] left-[8%] items-start text-left',
                'top-right': 'top-[6%] right-[8%] items-end text-right',
                'bottom-left': 'bottom-[12%] left-[8%] items-start text-left',
                'bottom-right': 'bottom-[12%] right-[8%] items-end text-right',
            }[config.logoPosition];

            const alignmentStyles = {
                left: 'text-left items-start',
                center: 'text-center items-center',
                right: 'text-right items-end'
            }[slide.contentAlign];

            const bgStyle = config.bgType === 'image' && config.globalImage 
                ? { backgroundImage: `url(${config.globalImage})`, backgroundSize: 'cover', backgroundPosition: 'center' }
                : { background: `radial-gradient(circle at 75% 25%, ${slide.accent}22 0%, #000000 100%)` };

            const scale = isPreview ? 0.4 : 1.5;

            return (
                <div 
                    className="relative overflow-hidden flex flex-col noise-overlay bg-black"
                    style={{ 
                        ...bgStyle,
                        width: isPreview ? '360px' : '1080px',
                        height: isPreview ? '450px' : '1350px',
                        fontFamily: FONTS[config.font],
                        borderRadius: isPreview ? '24px' : '0'
                    }}
                >
                    {/* LOGO MARCA */}
                    <div className={`absolute flex flex-col z-30 font-black tracking-tighter ${logoStyles}`} style={{ color: slide.accent }}>
                        {config.brandIcon && (
                            <img 
                                src={config.brandIcon} 
                                className="mb-2 object-contain" 
                                style={{ height: `${config.brandIconSize * (isPreview ? 0.35 : 1)}px` }} 
                            />
                        )}
                        <span style={{ fontSize: `${config.logoSize * (isPreview ? 0.35 : 1)}px`, lineHeight: 0.9 }}>
                            {config.logo}
                        </span>
                    </div>

                    {/* CONTENIDO */}
                    <div className={`relative z-20 flex-grow flex flex-col justify-center px-[10%] py-[12%] ${alignmentStyles}`}>
                        {slide.title && (
                            <div className={`w-full flex flex-col ${alignmentStyles} mb-[5%]`}>
                                <h2 className="font-black leading-[1.1] tracking-tight uppercase" style={{ 
                                    fontSize: `${slide.titleSize * scale}px`, 
                                    color: slide.accent
                                }}>
                                    {slide.title}
                                </h2>
                                <div className="w-[15%] h-2 rounded-full mt-3" style={{ backgroundColor: slide.accent }}></div>
                            </div>
                        )}
                        
                        {slide.slideImage && (
                            <div className="mb-[6%] w-full flex overflow-hidden rounded-3xl" style={{ 
                                maxHeight: isPreview ? `${slide.imageHeight * 3}px` : `${slide.imageHeight * 10}px`, 
                                justifyContent: slide.contentAlign 
                            }}>
                                <img src={slide.slideImage} className="w-auto h-full object-contain" />
                            </div>
                        )}
                        
                        <div className="font-medium leading-relaxed whitespace-pre-wrap w-full" style={{ 
                            fontSize: `${slide.textSize * (slide.title ? scale : scale * 1.4)}px`, 
                            color: '#fff',
                            fontWeight: slide.title ? 400 : 700
                        }}>
                            {slide.text}
                        </div>
                    </div>

                    {/* PIE DE PÁGINA */}
                    <div className="mt-auto p-[10%] pt-0 relative z-20 flex justify-end items-end">
                        <div className="text-right flex flex-col items-end">
                            {index < total - 1 && (
                                <span className="font-bold tracking-[0.3em] mb-1 uppercase" style={{ fontSize: isPreview ? '8px' : '20px', color: slide.accent }}>
                                    DESLIZA
                                </span>
                            )}
                            <div className="flex items-center font-black italic tracking-tighter" style={{ color: slide.accent }}>
                                <span style={{ fontSize: isPreview ? '14px' : '40px' }}>{index + 1} / {total}</span>
                                <span className="ml-2 opacity-40" style={{ fontSize: isPreview ? '22px' : '60px' }}>→</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
